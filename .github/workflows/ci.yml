name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - mcp-opentargets
          - mcp-geodownload
          - mcp-cibersortx
          - mcp-neoantigen
          - mcp-patient-report
          - mcp-genomic-results
          - mcp-cell-classify
          - mcp-spatialtools
          - mcp-server-boilerplate
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: servers/${{ matrix.server }}
        run: uv sync --dev
      - name: Run tests
        working-directory: servers/${{ matrix.server }}
        run: uv run pytest -v
