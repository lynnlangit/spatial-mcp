name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - mcp-opentargets
          - mcp-geodownload
          - mcp-cibersortx
          - mcp-neoantigen
          - mcp-patient-report
          - mcp-genomic-results
          - mcp-cell-classify
          - mcp-spatialtools
          - mcp-server-boilerplate
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: servers/${{ matrix.server }}
        run: uv sync --dev
      - name: Run tests
        working-directory: servers/${{ matrix.server }}
        run: uv run pytest -v
      - name: PAT001 canonical values summary
        if: success()
        run: |
          echo "## PAT001 Regression Checkpoint" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Expected |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| HRD score | 54 |" >> $GITHUB_STEP_SUMMARY
          echo "| TMB | 47.3 mut/Mb |" >> $GITHUB_STEP_SUMMARY
          echo "| IC50 (RMPEAAPPV) | 7.8 nM |" >> $GITHUB_STEP_SUMMARY
          echo "| Spatial spots | 300 |" >> $GITHUB_STEP_SUMMARY
          echo "| Moran's I | ≈ -0.0033 |" >> $GITHUB_STEP_SUMMARY
          echo "| CD8+ T cells | 30 |" >> $GITHUB_STEP_SUMMARY

  eval-harness-smoke:
    name: MTBBench Harness Smoke Test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install harness deps
        run: uv pip install --system pytest
      - name: Smoke test (DRY_RUN)
        env:
          DEIDENTIFY_DRY_RUN: "true"
          CARDIOMETABOLIC_DRY_RUN: "true"
          SYNTHETIC_DATA: "true"
        run: |
          python -m pytest eval/test_milestone_1.py eval/test_milestone_2.py \
            -v -m integration --tb=short --timeout=120
