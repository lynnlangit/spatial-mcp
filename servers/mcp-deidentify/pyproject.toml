[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-deidentify"
version = "0.1.0"
description = "HIPAA-aligned de-identification server for Precision Medicine MCP — Stage 0 preprocessing"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.13.0",
    "anthropic>=0.30.0",
    "pydantic>=2.0.0",
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.0",
    "anndata>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
mcp-deidentify = "mcp_deidentify.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_deidentify"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: requires ANTHROPIC_API_KEY and makes real Haiku calls (skip in CI)",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
